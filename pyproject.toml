[project]
name = "smm-gpt"
version = "0.1.0"
description = "Chat-first SMM operations platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.19.1",
    "asyncpg==0.31.0",
    "celery[redis]==5.6.3",
    "fastapi[standard]==0.141.1",
    "mcp==2.1.1",
    "pydantic-settings==2.15.0",
    "redis==6.4.0",
    "sqlalchemy==2.0.52",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/smm_gpt"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
exclude = ["migrations/versions"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["smm_gpt.workers.tasks"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires the local Compose infrastructure",
]

[tool.coverage.run]
branch = true
source = ["smm_gpt"]

[tool.coverage.report]
show_missing = true
skip_covered = true
