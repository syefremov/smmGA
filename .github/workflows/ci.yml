name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      identity-postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: smm_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55439:5432
        options: >-
          --health-cmd "pg_isready -U smm_test" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.8
          enable-cache: true

      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: |
          uv sync --locked --all-groups
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Check source and generated contracts
        run: pnpm check

      - name: Run unit and component tests
        run: pnpm test

      - name: Verify identity on disposable PostgreSQL databases
        env:
          SMM_TEST_DATABASE_URL: postgresql+asyncpg://smm_test@127.0.0.1:55439/postgres
        run: uv run pytest tests/database -m integration

      - name: Build frontend
        run: pnpm build:web

  integration:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.8
          enable-cache: true

      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: |
          uv sync --locked --all-groups
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Create isolated local configuration
        run: pnpm env:init

      - name: Validate and build images without cache
        run: |
          docker compose config --quiet
          docker run --rm -v "$PWD/ops/Caddyfile.authenticated:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose build --no-cache

      - name: Start the complete stack
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Verify queue and transports
        run: |
          pnpm worker:smoke
          pnpm test:integration

      - name: Install pinned Playwright browser
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm test:e2e

      - name: Show service logs after a failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  server-integration:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Validate shell entry points
        run: |
          for script in scripts/*.sh ops/*.sh; do bash -n "$script"; done
          shellcheck scripts/*.sh ops/*.sh

      - name: Exercise server lifecycle on synthetic data
        run: sudo --preserve-env=GITHUB_ACTIONS python3 -m scripts.server_integration

      - name: Show container health without secrets
        if: failure()
        run: |
          docker ps --all --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          docker inspect --format '{{.State.Error}}' smm-gpt-staging-web-1 || true
          docker logs --tail=30 smm-gpt-staging-web-1 || true
